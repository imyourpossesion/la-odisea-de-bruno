<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>La Odisea de Bruno</title>
<style>
  :root{--ink:#2a2a2a;--paper:#f6f1e4;--resto:120px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Patrick Hand","Comic Sans MS","Chalkboard SE","Marker Felt",cursive}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 12px;gap:8px;
    background-image:repeating-linear-gradient(transparent 0 31px,#d9e4f0 31px 32px)}
  #wrap{width:min(100%,calc((100vh - var(--resto))*2.5));width:min(100%,calc((100dvh - var(--resto))*2.5));max-width:none}
  canvas{display:block;width:100%;aspect-ratio:900/360;border:4px solid var(--ink);border-radius:14px 8px 16px 10px;
    background:#fff;touch-action:none;box-shadow:5px 5px 0 var(--ink)}
  .fila{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%;max-width:none}
  .btn{font:inherit;font-size:19px;border:3px solid var(--ink);border-radius:14px 10px 16px 9px;background:#fff6b8;color:var(--ink);
    padding:8px 16px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
  .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  #touch{display:none}
  #touch .btn{flex:1;font-size:20px;padding:10px 6px}
  #touch .chico{flex:0 0 auto;padding:10px 14px}
  #girar{display:none;margin:0;font-size:18px;text-align:center}
  /* celu / tablet (solo táctil): botones en pantalla, sin ayuda de teclas */
  @media (hover:none) and (pointer:coarse){
    #touch{display:flex}
    .ayuda,#utilfila{display:none}
    :root{--resto:84px}
  }
  @media (hover:none) and (pointer:coarse) and (orientation:portrait){#girar{display:block}}
  .ayuda{font-size:16px;opacity:.75;text-align:center;margin:0}
</style>
</head>
<body>
<p id="girar">📱 Girá el celular para jugar más grande</p>
<div id="wrap"><canvas id="c" width="900" height="360"></canvas></div>
<div id="touch" class="fila">
  <button class="btn" id="bSalta">⬆ SALTAR</button>
  <button class="btn" id="bAgacha">⬇ AGACHAR</button>
  <button class="btn" id="bDispara">💥 DISPARAR</button>
  <button class="btn chico" id="bFsT">⛶</button>
  <button class="btn chico" id="bMuteT">🔊</button>
</div>
<div class="fila" id="utilfila">
  <button class="btn" id="bFs">⛶ Pantalla completa</button>
  <button class="btn" id="bMute">🔊 Sonido</button>
</div>
<p class="ayuda">Espacio / ↑ saltar · ↓ agacharse · ENTER disparar · en el menú, teclas 1–5 = ir directo a un jefe · G = gacha</p>

<script>
/* =====================================================================
   ✏️  EDITÁ ACÁ  ✏️
   Nombres de los jefes (poné el nombre de tus amigos), del juego, etc.
   ===================================================================== */
const TITULO = 'LA ODISEA DE BRUNO';
const FIN_TEXTO = '¡Le ganaste a los jefes!';
const MOSTRAR_NOMBRES = false;   // false = los nombres de los jefes NO se ven en el juego (sorpresa). true = se ven.
const nom=i=>MOSTRAR_NOMBRES?JEFES[i].nombre:'JEFE '+(i+1);

/* Cada MUNDO: nombre y colores del cielo (degradado de arriba a abajo) y del piso provisorio.
   TODO lo demás (piso, nubes/decoración, fondo lento, obstáculos) lo ponés vos con tus dibujos. */
const MUNDOS = [
  {n:'La Pradera',      bg:'#7cc8ff', bg2:'#d6f1ff', suelo:'#8fd36a', deco:'nube',    obst:'arbusto'},   // Lucio: pasto verde, cielo azul
  {n:'San Valentín',    bg:'#ffb3d1', bg2:'#ffe3ef', suelo:'#ff9fc2', deco:'nube',    obst:'arbusto'},   // Brisa: todo rosa
  {n:'Ciudad de Noche', bg:'#0d1033', bg2:'#2d3573', suelo:'#3a3f6b', deco:'luna',    obst:'lapida'},    // Mica: ciudad de noche
  {n:'El Espacio',      bg:'#07051a', bg2:'#2a1a5e', suelo:'#5b4b9a', deco:'planeta', obst:'cristal', estrellas:true},   // Sol: espacio
  {n:'El Prado',        bg:'#9fdcff', bg2:'#e0f7ff', suelo:'#7fcf5a', deco:'nube',    obst:'arbusto'},   // Rocío: pasto verde
];

/* Cada JEFE: vida (golpes), tamaño, cómo ataca, y la carita por defecto.
   tiro:  'criatura' = la imagen salta del jefe y corre por el piso hacia el jugador (hay que saltarla)
          'normal'   = disparo que vuela derecho hacia el jugador
   Ataques posibles: criatura, bajo (saltar), alto (agacharse o saltar), apunta (a la altura del jefe), doble, embestida */
const JEFES = [
  {nombre:'LUCIO', hp:7,  w:110,h:140, mov:'quieto', tiro:'criatura', ataques:['criatura','criatura','criatura','doble'], cada:1.9,
    cara:{color:'#ffd9b0',ojos:'enojado',boca:'serrucho',extra:'gorro'}},
  {nombre:'BRISA', hp:8,  w:110,h:100, mov:'vuela', cy:175, amp:45, tiro:'normal', ataques:['apunta','bajo','alto'], cada:1.8,
    cara:{color:'#d5f2ff',ojos:'bizco',boca:'abierta',extra:'moño'}},
  {nombre:'MICA', hp:8,  w:110,h:140, mov:'quieto', escudo:true, tiro:'normal', ataques:['bajo','alto','doble'], cada:1.6,
    cara:{color:'#ffe6a8',ojos:'gafas',boca:'diente',extra:'pelo'}},
  {nombre:'SOL', hp:10, w:110,h:105, mov:'quieto', tiro:'criatura', ataques:['embestida','criatura','embestida','criatura'], cada:1.5,
    cara:{color:'#ffc0c0',ojos:'enojado',boca:'abierta',extra:'cuernos'}},
  {nombre:'ROCÍO', hp:11, w:110,h:140, mov:'quieto', tiro:'criatura', ataques:['criatura','doble','criatura','doble'], cada:1.4,
    cara:{color:'#d9ffd0',ojos:'normal',boca:'sonrisa',extra:'pelo'}},
];
/* Lo que dice cada jefe cuando le pegás (se elige una al azar) */
const FRASES = [
  ['es humor','bueeeeno','AHHHH'],          // 1
  ['corteeee','ayyyyy'],                    // 2
  ['DIOS','BASTA'],                         // 3
  ['pero la pucha','basta eu'],             // 4
  ['ayyyyyyy','dios mio'],                  // 5
];
JEFES.forEach((j,i)=>j.frases=FRASES[i]);

const PROTA = 'BRUNO';
const RUN_SEG = 10;     // segundos de carrera antes de cada jefe
const FADE_SEG = 2.5;     // segundos que dura el fade de un mundo al otro
const VIDAS = 3;

/* =====================================================================
   Motor
   ===================================================================== */
const W=900,H=360,GY=300,INK='#2a2a2a';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let dpr=1;
function ajustar(){   /* la resolución interna sigue al tamaño en pantalla, así se ve nítido aunque el juego se vea grande */
  const r=cv.getBoundingClientRect();
  const esc=Math.min(2.5,Math.max(1,r.width*(window.devicePixelRatio||1)/W));
  if(Math.abs(esc-dpr)<.01&&cv.width>W)return;
  dpr=esc;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.imageSmoothingQuality='high';
}
ajustar();
if(window.ResizeObserver)new ResizeObserver(ajustar).observe(cv);else addEventListener('resize',ajustar);
const FONT='"Patrick Hand","Comic Sans MS","Chalkboard SE","Marker Felt",cursive';
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ---------- sonido ---------- */
let AC=null,mute=false;
function snd(f,d=.1,tipo='square',vol=.04,f2){
  if(mute)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    o.type=tipo;o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);}catch(e){}
}

/* ---------- imágenes (PNG) ---------- */
/* Tamaño (en píxeles del juego) de la caja donde se dibuja cada cosa. */
const BOX={portada:[900,360],player:[72,72],playerduck:[72,72],bala:[28,24],pajaro:[72,60],
  obs:[50,60],deco:[140,140],bg:[900,360],piso:[300,60],para:[600,240],tiroC:[64,64],tiroN:[56,56]};
const PISO_W=BOX.piso[0],PARA_W=BOX.para[0],PARA_H=BOX.para[1];
const SLOTS=[];
const FRAMES={};   // id -> cantidad de cuadros (hoja de sprites, uno al lado del otro)
const FPS=10;      // cuadros por segundo de la animación
function addSlot(id,label,g,box,o){o=o||{};if(o.frames)FRAMES[id]=o.frames;
  SLOTS.push({id,label,g,w:box[0],h:box[1]})}
addSlot('portada','Imagen de portada','Pantalla de inicio',BOX.portada);
addSlot('player',PROTA+': hoja de 4 cuadros de 150x150 (1-2 caminar, 3 saltar, 4 morir)',PROTA,BOX.player,{frames:4});
addSlot('playerduck',PROTA+' agachado: hoja de 2 cuadros de 150x150',PROTA,BOX.playerduck,{frames:2});
addSlot('bala','Disparo de '+PROTA+' (opcional)',PROTA,BOX.bala);
addSlot('pajaro1','Pájaro del nivel 1 (normal)','Pájaros',BOX.pajaro);
addSlot('pajaro2','Pájaro con cara de compañero (nivel 2 en adelante)','Pájaros',BOX.pajaro);
[3,4,5].forEach(k=>addSlot('pajaro'+k,'Pájaro solo del nivel '+k+' (opcional)','Pájaros',BOX.pajaro));
MUNDOS.forEach((m,i)=>{const n=i+1,j=JEFES[i],g='Mundo '+n;
  addSlot('boss'+n,'Jefe '+n,g,[j.w+20,j.h+20]);
  addSlot('tiro'+n,'Disparo del jefe '+n,g,j.tiro==='criatura'?BOX.tiroC:BOX.tiroN);
  addSlot('obs'+n,'Obstáculo (saltar)',g,BOX.obs);
  addSlot('deco'+n,'Decoración 1',g,BOX.deco);
  addSlot('deco'+n+'b','Decoración 2 (opcional)',g,BOX.deco);
  addSlot('deco'+n+'c','Decoración 3 (opcional)',g,BOX.deco);
  addSlot('piso'+n,'Piso (se repite)',g,BOX.piso);
  addSlot('para'+n,'Fondo lento (se repite)',g,BOX.para);
});
/* jefe final del gacha (el que dibujás vos): dibujos/bossfinal.png */
addSlot('bossfinal','Jefe final del gacha','Gacha',[130,160]);
const IMG={};
/* busca cada PNG en la carpeta dibujos/ y, si no está, al lado del HTML */
function cargarImg(id,rutas){
  const im=new Image();
  im.onload=()=>{IMG[id]=im};
  im.onerror=()=>{if(rutas.length>1)cargarImg(id,rutas.slice(1))};
  im.src=rutas[0];
}
SLOTS.forEach(s=>cargarImg(s.id,['dibujos/'+s.id+'.png',s.id+'.png','Dibujos/'+s.id+'.png']));
cargarImg('pajaro',['dibujos/pajaro.png','pajaro.png']);   // compatibilidad: pajaro.png se usa como pajaro1
function sprite(id,x,y,w,h,fo){const im=IMG[id];if(!im)return false;
  /* si la imagen es una hoja (mucho más ancha que alta) se anima cuadro por cuadro; si es un dibujo suelto se muestra entero */
  const n=FRAMES[id]||1,hoja=n>1&&im.width/im.height>=n*.75,fw=hoja?im.width/n:im.width,f=hoja?(fo!=null?fo:Math.floor(tiempo*FPS)%n):0;
  const s=Math.min(w/fw,h/im.height),dw=fw*s,dh=im.height*s;
  ctx.drawImage(im,f*fw,0,fw,im.height,x+(w-dw)/2,y+h-dh,dw,dh);return true}
function espacio(x,y,w,h,label,sub){
  ctx.save();ctx.lineWidth=2.5;ctx.strokeStyle='#777';ctx.setLineDash([7,5]);ctx.lineJoin='round';
  poli([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],'rgba(255,255,255,.55)',11);
  ctx.setLineDash([]);
  const fs=Math.max(10,Math.min(20,w/(label.length*.62)));
  txt(label,x+w/2,y+h/2-(sub?fs*.6:0),fs,'#555','center',null);
  if(sub)txt(sub,x+w/2,y+h/2+fs*.7,Math.max(9,fs*.7),'#888','center',null);
  ctx.restore();
}

/* ---------- primitivas "mal dibujadas" ---------- */
let tiempo=0,tick=0;
function hash(n){n=Math.sin(n*127.1)*43758.5453;return n-Math.floor(n)}
function J(i,s){return (hash(i*13.37+s*7.7+tick*3.1)-.5)*2}
function trazo(pts,amp=1.6,seed=0){
  ctx.beginPath();
  for(let i=0;i<pts.length;i++){const x=pts[i][0]+J(i,seed)*amp,y=pts[i][1]+J(i,seed+31)*amp;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}
  ctx.stroke();
}
function poli(pts,fill,seed=0){
  const q=pts.map((p,i)=>[p[0]+J(i,seed)*1.5,p[1]+J(i,seed+31)*1.5]);
  const mk=(dx,dy)=>{ctx.beginPath();q.forEach((p,i)=>i?ctx.lineTo(p[0]+dx,p[1]+dy):ctx.moveTo(p[0]+dx,p[1]+dy));ctx.closePath()};
  if(fill){mk(2,-2);ctx.fillStyle=fill;ctx.fill()}
  mk(0,0);ctx.stroke();
}
function blob(cx,cy,rx,ry,fill,seed=0){
  const n=18,pts=[];for(let i=0;i<n;i++){const a=i/n*6.2832;pts.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry])}
  poli(pts,fill,seed);
}
function txt(s,x,y,size,col=INK,al='center',borde='#fff'){
  ctx.font='bold '+size+'px '+FONT;ctx.textAlign=al;ctx.textBaseline='middle';
  if(borde){ctx.lineWidth=5;ctx.strokeStyle=borde;ctx.lineJoin='round';ctx.strokeText(s,x,y)}
  ctx.fillStyle=col;ctx.fillText(s,x,y);
}
function estilo(){ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.lineJoin='round';ctx.lineCap='round'}

/* ---------- obstáculos y decoraciones ---------- */
function dibObst(kind,x,y,w,h){
  estilo();const cx=x+w/2;
  if(kind==='arbusto'){blob(cx,y+h*.62,w*.52,h*.38,'#6cc24a',1);blob(x+w*.2,y+h*.75,w*.3,h*.25,'#58b03a',2);blob(x+w*.8,y+h*.75,w*.3,h*.25,'#58b03a',3);trazo([[cx,y+h],[cx,y+h*.55]],1)}
  else if(kind==='cactus'){blob(cx,y+h/2,w*.3,h/2,'#5fae5f',1);blob(x+w*.08,y+h*.42,w*.16,h*.16,'#5fae5f',2);blob(x+w*.92,y+h*.3,w*.16,h*.16,'#5fae5f',3);trazo([[cx,y+h*.2],[cx,y+h*.4]],.5)}
  else if(kind==='lapida'){poli([[x,y+h],[x,y+h*.3],[x+w*.2,y+h*.05],[x+w*.5,y],[x+w*.8,y+h*.05],[x+w,y+h*.3],[x+w,y+h]],'#c9c9d6');txt('RIP',cx,y+h*.45,Math.max(11,w*.36),INK,'center',null)}
  else if(kind==='roca'){poli([[x,y+h],[x+w*.1,y+h*.4],[x+w*.35,y],[x+w*.7,y+h*.2],[x+w,y+h*.5],[x+w*.95,y+h]],'#8a5a4a');trazo([[x+w*.4,y+h*.2],[x+w*.5,y+h*.45],[x+w*.38,y+h*.6],[x+w*.55,y+h*.85]],1);ctx.strokeStyle='#ffb02e';trazo([[x+w*.4,y+h*.2],[x+w*.5,y+h*.45],[x+w*.38,y+h*.6],[x+w*.55,y+h*.85]],0.6);estilo()}
  else if(kind==='muneco'){blob(cx,y+h*.78,w*.5,h*.22,'#fff',1);blob(cx,y+h*.48,w*.38,h*.2,'#fff',2);blob(cx,y+h*.2,w*.28,h*.16,'#fff',3);poli([[cx,y+h*.2],[cx+w*.4,y+h*.24],[cx,y+h*.27]],'#ff8a1f');ctx.fillStyle=INK;[-1,1].forEach(s=>{ctx.beginPath();ctx.arc(cx+s*w*.1,y+h*.15,1.8,0,6.3);ctx.fill()})}
  else if(kind==='cristal'){poli([[x,y+h],[x+w*.2,y+h*.35],[x+w*.35,y+h*.5],[x+w*.5,y],[x+w*.68,y+h*.45],[x+w*.82,y+h*.25],[x+w,y+h]],'#ff9be2');trazo([[x+w*.5,y],[x+w*.45,y+h]],.5)}
}
function dibPajaro(x,y,w,h,ph){
  estilo();const cx=x+w/2,cy=y+h/2,a=Math.sin(ph)*h*.9;
  poli([[cx-w*.1,cy],[cx-w*.35,cy-a],[cx+w*.1,cy-h*.1]],'#fff');
  blob(cx,cy,w*.34,h*.38,'#ff8a8a',1);
  poli([[cx-w*.32,cy-h*.15],[cx-w*.55,cy],[cx-w*.32,cy+h*.1]],'#ffc93c');
  ctx.fillStyle=INK;ctx.beginPath();ctx.arc(cx-w*.18,cy-h*.1,2,0,6.3);ctx.fill();
  poli([[cx+w*.1,cy],[cx+w*.35,cy-a*.8],[cx+w*.05,cy-h*.1]],'#fff');
}
function dibDeco(kind,x,y,s,idx){
  estilo();
  if(kind==='nube'){blob(x,y,34*s,16*s,'#fff',1);blob(x-22*s,y+4*s,20*s,11*s,'#fff',2);blob(x+24*s,y+5*s,22*s,11*s,'#fff',3)}
  else if(kind==='cactus'){blob(x,y-30*s,10*s,30*s,'#a5d6a0',1);blob(x-14*s,y-34*s,6*s,10*s,'#a5d6a0',2);blob(x+14*s,y-42*s,6*s,10*s,'#a5d6a0',3)}
  else if(kind==='luna'){if(idx%2){blob(x,y,18*s,18*s,'#fff3a0',1);blob(x+9*s,y-3*s,15*s,15*s,'#bcd0f5',2)}else{trazo([[x-8,y],[x+8,y]],.5);trazo([[x,y-8],[x,y+8]],.5);trazo([[x-5,y-5],[x+5,y+5]],.5);trazo([[x+5,y-5],[x-5,y+5]],.5)}}
  else if(kind==='volcan'){poli([[x-70*s,y],[x-18*s,y-70*s],[x+18*s,y-70*s],[x+70*s,y]],'#b9775f');blob(x,y-76*s,20*s,8*s,'#ff9b3d',1);blob(x-6*s,y-100*s,10*s,10*s,'#ddd',2);blob(x+8*s,y-122*s,8*s,8*s,'#eee',3)}
  else if(kind==='copo'){for(let i=0;i<3;i++){const a=i*Math.PI/3;trazo([[x-Math.cos(a)*12*s,y-Math.sin(a)*12*s],[x+Math.cos(a)*12*s,y+Math.sin(a)*12*s]],.5)}}
  else if(kind==='planeta'){blob(x,y,22*s,22*s,idx%2?'#ffb86b':'#8ee0c4',1);ctx.beginPath();ctx.ellipse(x,y,38*s,9*s,-.3,0,6.3);ctx.stroke()}
}
const DECO_SUELO={cactus:1,volcan:1};

/* ---------- estado ---------- */
let estado='menu',G=null,P=null,keys={disp:false,abajo:false},shake=0,flash=0;
const dbg=location.search.includes('dios');
function vm(m){return 380+m*45}   // velocidad base de cada mundo (sube mundo a mundo)
function mkG(mundo){return {mundo,fase:'mundo',t:0,vidas:VIDAS,scroll:0,vel:vm(mundo),obst:[],proj:[],balas:[],min:[],part:[],textos:[],decos:[],boss:null,cola:[],sig:1,irAJefe:false,tOver:0}}
function mkP(){return {x:90,y:GY-60,vy:0,w:34,h:60,duck:false,suelo:true,cd:0,inv:0,buf:0,disp:0}}
function sembrarDecos(){
  G.decos=[];const k=MUNDOS[G.mundo].deco,n=k==='volcan'?2:6;
  for(let i=0;i<n;i++)G.decos.push(nuevaDeco(k,i,i*W/n+rnd(0,80)));
}
function nuevaDeco(k,i,x){
  return {x,i,y:DECO_SUELO[k]?GY:rnd(40,125),s:rnd(.85,1.25),k}
}
function nuevo(mundo,saltarCarrera){
  G=mkG(mundo);P=mkP();G.irAJefe=!!saltarCarrera;G.vel=vm(mundo);sembrarDecos();estado='jugando';
  if(mundo===0&&!saltarCarrera)G.vidas=VIDAS;
}
G=mkG(0);P=mkP();G.fase='demo';sembrarDecos();

function empezar(){
  if(estado==='menu')nuevo(0,false);
  else if(estado==='gameover'&&G.tOver>.6)nuevo(G.mundo,true);
  else if(estado==='victoria'&&G.tOver>1.2){G=mkG(0);P=mkP();G.fase='demo';sembrarDecos();estado='menu'}
}

/* ---------- lógica ---------- */
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const pbox=()=>({x:P.x+7,y:P.y+5,w:P.w-14,h:P.h-7});
function danio(){
  if(P.inv>0||estado!=='jugando'||G.fase==='muerteJefe'||dbg)return;
  G.vidas--;P.inv=1.6;shake=.35;snd(160,.3,'sawtooth',.06,60);
  if(G.vidas<=0){estado='gameover';G.tOver=0;snd(300,.7,'square',.06,60)}
}
function puff(x,y,n,cols){for(let i=0;i<n;i++)G.part.push({x,y,vx:rnd(-220,220),vy:rnd(-300,60),l:rnd(.4,.9),max:.9,c:pick(cols||['#ffd23f','#ff6fa5','#6fd0ff','#fff']),k:Math.random()<.5?'e':'c'})}
function texto(s,x,y,l){G.textos.push({s,x,y,l:l||.8})}

function bossDe(m){
  const d=JEFES[m];
  return {...d,m,hpMax:d.hp,x:W+160,tx:W-d.w-45,y:GY-d.h,estado:'entra',t:0,cd:1.2,aviso:null,avT:0,flash:0,dash:null,esc:!!d.escudo,rot:0,ph:0,sufre:0};
}
function bbox(b){return b.dash?{x:b.x+b.w/2-45,y:GY-80,w:90,h:80}:{x:b.x,y:b.y,w:b.w,h:b.h}}
function vuln(b){return b.estado==='lucha'&&!b.dash&&!(b.escudo&&b.esc)}

function ejecutar(b,a){
  const v=G.mundo*28,id='tiro'+(b.m+1);
  if(a==='criatura')G.proj.push({k:'criatura',id,x:b.x+8,y:b.y+b.h*.55,vx:-(240+v),vy:-430,aire:true,rot:0,t:0,v});
  else if(a==='bajo')G.proj.push({k:'normal',id,x:b.x,y:GY-26,vx:-(390+v),t:0});
  else if(a==='alto')G.proj.push({k:'normal',id,x:b.x,y:GY-52,vx:-(460+v),t:0});
  else if(a==='apunta')G.proj.push({k:'normal',id,x:b.x,y:b.y+b.h/2,vx:-(440+v),t:0});
  else if(a==='doble'){const s=b.tiro==='criatura'?'criatura':'bajo';ejecutar(b,s);G.cola.push({t:.85,f:()=>{if(G.boss&&G.boss.estado==='lucha')ejecutar(b,s)}})}
  else if(a==='embestida'){b.dash={f:'ir'};snd(120,.5,'sawtooth',.05,300)}
  if(a!=='embestida')snd(a==='criatura'?330:260,.12,'triangle',.05,180);
}

function updBoss(dt){
  const b=G.boss;if(!b)return;
  b.t+=dt;b.ph+=dt*6;b.flash=Math.max(0,b.flash-dt);
  if(b.mov==='vuela')b.y=b.cy-b.h/2+Math.sin(b.t*1.7)*b.amp;
  if(b.escudo)b.esc=(b.t%3.0)<1.7;
  if(b.estado==='entra'){b.x-=380*dt;if(b.x<=b.tx){b.x=b.tx;b.estado='lucha';b.cd=1.1}}
  else if(b.estado==='lucha'){
    if(b.dash){
      b.rot+=dt*14;
      if(b.dash.f==='ir'){b.x-=760*dt;if(b.x<-b.w-30){b.dash.f='vuelve';b.x=W+90}}
      else{b.x-=420*dt;if(b.x<=b.tx){b.x=b.tx;b.dash=null;b.cd=1.0}}
    }else{
      b.cd-=dt;
      if(b.aviso){b.avT-=dt;if(b.avT<=0){ejecutar(b,b.aviso);b.aviso=null;b.cd=b.cada*(b.hp<=b.hpMax/2?.78:1)*rnd(.85,1.2)}}
      else if(b.cd<=0){b.aviso=pick(b.ataques);b.avT=b.aviso==='embestida'?.9:.4}
    }
    if(hit(pbox(),bbox(b))&&b.dash)danio();
  }else if(b.estado==='muere'){
    if(Math.random()<.5)puff(b.x+rnd(0,b.w),b.y+rnd(0,b.h),2);
    if(b.t>1.6){
      if(G.mundo>=JEFES.length-1){estado='victoria';G.tOver=0;snd(500,.6,'triangle',.06,1000);return}
      G.prev={mundo:G.mundo,decos:G.decos};
      G.mundo++;G.fase='mundo';G.t=0;G.boss=null;G.vel=vm(G.mundo);G.vidas=Math.min(VIDAS,G.vidas+1);
      G.obst=[];G.proj=[];G.min=[];G.irAJefe=false;sembrarDecos();
    }
  }
}
function golpeBoss(b){
  b.hp--;b.flash=.3;b.sufre=.3;puff(b.x+b.w/2,b.y+b.h/2,10);texto(pick(b.frases),Math.max(90,Math.min(W-90,b.x+b.w/2+rnd(-15,15))),b.y-6,1.2);
  snd(220,.15,'square',.06,90);shake=.12;
  if(b.hp<=0){b.estado='muere';b.t=0;b.dash=null;G.proj=[];G.min=[];snd(400,.9,'sawtooth',.06,40)}
}

function update(dt){
  tiempo+=dt;tick=Math.floor(tiempo*8);
  shake=Math.max(0,shake-dt);flash=Math.max(0,flash-dt*1.2);
  if(estado==='menu'){G.scroll+=G.vel*dt;decos(dt);return}
  if(estado==='gacha'){gachaUpd(dt);return}
  if(estado==='gameover'){G.tOver+=dt;return}
  if(estado==='victoria'){G.tOver+=dt;if(Math.random()<.6)G.part.push({x:rnd(0,W),y:-10,vx:rnd(-30,30),vy:rnd(80,200),l:3,max:3,c:pick(['#ffd23f','#ff6fa5','#6fd0ff','#9be37a']),k:'c',g:0});parts(dt);return}
  G.t+=dt;{const k=G.fase==='mundo'?0:G.fase==='carrera'?Math.min(1,G.t/RUN_SEG):1;G.vel=vm(G.mundo)*(1+.12*k)}  /* acelera un 12% durante la carrera */
  G.scroll+=G.vel*dt;
  decos(dt);

  /* jugador */
  const wantDuck=keys.abajo;
  if(P.suelo)P.duck=wantDuck;else{P.duck=false;if(wantDuck)P.vy+=3000*dt}
  const h=P.duck?32:60;
  if(P.suelo){P.h=h;P.y=GY-h}
  P.buf-=dt;P.cd-=dt;P.disp-=dt;P.inv-=dt;
  if(P.buf>0&&P.suelo){P.vy=-780;P.suelo=false;P.duck=false;P.h=60;P.y=GY-60;P.buf=0;snd(420,.15,'square',.04,760)}
  if(!P.suelo){P.vy+=2300*dt;P.y+=P.vy*dt;P.h=60;if(P.y>=GY-60&&P.vy>=0){P.y=GY-60;P.vy=0;P.suelo=true}}
  if(keys.disp&&P.cd<=0){P.cd=.38;P.disp=.18;G.balas.push({x:P.x+P.w,y:P.y+(P.duck?14:24),vx:780});snd(700,.08,'square',.025,400)}

  /* fases */
  if(G.fase==='mundo'){
    if(G.t>(G.prev?FADE_SEG:1.5)){G.fase=G.irAJefe?'aviso':'carrera';G.t=0;G.irAJefe=false;G.prev=null}
  }else if(G.fase==='carrera'){
    G.sig-=dt;
    if(G.t<RUN_SEG-1&&G.sig<=0){spawnObst();G.sig=rnd(.95,1.5)*(1-.04*G.mundo)}
    if(G.t>=RUN_SEG&&G.obst.length===0){G.fase='aviso';G.t=0;snd(200,.4,'sawtooth',.05,100)}
  }else if(G.fase==='aviso'){
    if(G.t>1.7){G.fase='jefe';G.t=0;G.boss=bossDe(G.mundo)}
  }else if(G.fase==='jefe'){updBoss(dt);if(G.boss&&G.boss.estado==='muere')G.fase='muerteJefe'}
  else if(G.fase==='muerteJefe'){updBoss(dt)}

  /* obstáculos */
  const pb=pbox();
  for(const o of G.obst){
    o.x-=(G.vel+(o.t==='pajaro'?70:0))*dt;o.ph+=dt*12;
    if(hit(pb,{x:o.x+4,y:o.y+4,w:o.w-8,h:o.h-8}))danio();
  }
  G.obst=G.obst.filter(o=>o.x>-80);

  /* proyectiles del jefe */
  for(const q of G.proj){
    q.t+=dt;let hb;
    if(q.k==='criatura'){
      /* salta del jefe en arco, cae al piso y corre hacia el jugador */
      if(q.aire){
        q.x+=q.vx*dt;q.vy+=1600*dt;q.y+=q.vy*dt;q.rot+=dt*9;
        if(q.vy>0&&q.y>=GY-32){q.y=GY-32;q.aire=false;q.rot=0;q.vx=-(350+q.v);puff(q.x,GY-4,6,['#d9c9a8','#bfae8c','#fff']);snd(150,.08,'triangle',.05,90)}
      }else q.x+=q.vx*dt;
      hb={x:q.x-18,y:q.y-16,w:36,h:44};
    }else{q.x+=q.vx*dt;hb={x:q.x-13,y:q.y-13,w:26,h:26}}
    if(hit(pb,hb))danio();
  }
  G.proj=G.proj.filter(q=>q.x>-60);

  /* esbirros */
  for(const m of G.min){m.x+=m.vx*dt;m.ph+=dt*12;if(hit(pb,{x:m.x+4,y:m.y+4,w:m.w-8,h:m.h-6}))danio()}
  G.min=G.min.filter(m=>m.x>-50&&m.hp>0);

  /* balas */
  for(const bl of G.balas){
    bl.x+=bl.vx*dt;const bx={x:bl.x-6,y:bl.y-6,w:12,h:12};
    for(const m of G.min)if(m.hp>0&&hit(bx,m)){m.hp=0;bl.x=9999;puff(m.x+15,m.y+17,8);snd(520,.1,'square',.04,200);texto('¡plop!',m.x,m.y-8)}
    const b=G.boss;
    if(b&&b.estado==='lucha'&&!b.dash&&hit(bx,{x:b.x+8,y:b.y+8,w:b.w-16,h:b.h-16})){
      if(b.escudo&&b.esc){bl.x=9999;puff(bl.x,bl.y,0);G.part.push({x:b.x,y:bl.y,vx:-120,vy:-80,l:.3,max:.3,c:'#7fc8ff',k:'e'});snd(900,.06,'triangle',.04);texto('¡clank!',b.x-10,bl.y-10)}
      else{bl.x=9999;golpeBoss(b)}
    }
  }
  G.balas=G.balas.filter(b=>b.x<W+20);

  parts(dt);
  G.cola.forEach(c=>c.t-=dt);const lis=G.cola.filter(c=>c.t<=0);G.cola=G.cola.filter(c=>c.t>0);lis.forEach(c=>c.f());
}
function parts(dt){
  for(const p of G.part){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g==null?700:p.g)*dt;p.l-=dt}
  G.part=G.part.filter(p=>p.l>0);
  for(const t of G.textos){t.y-=40*dt;t.l-=dt}G.textos=G.textos.filter(t=>t.l>0);
}
function decos(dt){
  const v=G.vel*.35;
  if(G.prev)for(const d of G.prev.decos)d.x-=v*dt;
  for(const d of G.decos){d.x-=v*dt;if(d.x<-130){const n=nuevaDeco(d.k,d.i+1,W+rnd(40,200));Object.assign(d,n)}}
}
function spawnObst(){
  const m=MUNDOS[G.mundo];
  if(Math.random()<.3+.03*G.mundo){G.obst.push({t:'pajaro',x:W+30,y:GY-64,w:44,h:26,ph:0});return}
  const w=rnd(30,42),h=rnd(40,58);
  G.obst.push({t:'suelo',x:W+30,y:GY-h,w,h,k:m.obst});
  if(Math.random()<.2){const w2=Math.min(34,w);G.obst.push({t:'suelo',x:W+30+w+22,y:GY-h+6,w:w2,h:h-6,k:m.obst})}
}

/* qué imagen de pájaro usa cada mundo: pajaroN si existe; de nivel 2 en adelante pajaro2; si no, pajaro1 */
function pajaroId(m){
  const c=['pajaro'+(m+1)];if(m>=1)c.push('pajaro2');c.push('pajaro1','pajaro');
  return c.find(k=>IMG[k])||'pajaro'+(m+1);
}
/* estrellitas (solo puntitos) del espacio */
const ESTR=Array.from({length:38},(_,i)=>({x:hash(i*3.7+.1)*W,y:8+hash(i*5.9+2)*(GY-50),r:.8+hash(i*2.3+7)*1.0,f:hash(i*8.1)*6.28}));
function dibEstrellas(){
  const ga=ctx.globalAlpha;ctx.fillStyle='#fff';
  for(const e of ESTR){const x=((e.x-G.scroll*.03)%W+W)%W;ctx.globalAlpha=ga*(.55+.35*Math.sin(tiempo*1.5+e.f));ctx.beginPath();ctx.arc(x,e.y,e.r,0,6.3);ctx.fill()}
  ctx.globalAlpha=ga;
}
function dibMundo(mi,decs){
  const m=MUNDOS[mi],n=mi+1,hasBg=IMG['bg'+n],pisoImg=IMG['piso'+n];
  const gr=ctx.createLinearGradient(0,0,0,GY);gr.addColorStop(0,m.bg);gr.addColorStop(1,m.bg2||m.bg);
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  if(m.estrellas)dibEstrellas();
  if(hasBg)ctx.drawImage(hasBg,0,0,W,H);
  /* fondo lento (parallax) */
  const paraImg=IMG['para'+n];
  if(paraImg){
    ctx.save();ctx.beginPath();ctx.rect(0,0,W,GY);ctx.clip();
    const po=(G.scroll*.12)%PARA_W;
    for(let x=-po;x<W;x+=PARA_W)ctx.drawImage(paraImg,Math.floor(x),GY-PARA_H,PARA_W+1,PARA_H);
    ctx.restore();
  }
  if(!hasBg){ctx.fillStyle=m.suelo;ctx.fillRect(0,GY,W,H-GY)}
  /* decoraciones */
  for(const d of decs){
    const bw=110*d.s,y=DECO_SUELO[d.k]?GY-bw:d.y-bw/2;
    const ids=['deco'+n,'deco'+n+'b','deco'+n+'c'].filter(k=>IMG[k]),did=ids.length?ids[d.i%ids.length]:'deco'+n;
    if(!sprite(did,d.x-bw/2,y,bw,bw))espacio(d.x-bw*.3,DECO_SUELO[d.k]?GY-bw*.6:d.y-bw*.3,bw*.6,bw*.6,'deco');
  }
  /* piso */
  if(pisoImg){
    const off=G.scroll%PISO_W;
    for(let x=-off;x<W;x+=PISO_W)ctx.drawImage(pisoImg,Math.floor(x),GY,PISO_W+1,H-GY);
  }else{
    ctx.strokeStyle=INK;ctx.lineWidth=3.5;ctx.lineCap='round';
    const gp=[];for(let x=0;x<=W;x+=60)gp.push([x,GY]);trazo(gp,2.2,7);
  }
}
function dibJugador(){
  /* hoja de Bruno: cuadro 1-2 caminar, 3 saltar, 4 morir. Agachado: hoja de 2 cuadros */
  const muerto=estado==='gameover';
  if(!muerto&&P.inv>0&&Math.floor(tiempo*14)%2)return;
  const T=72,bx=P.x+P.w/2-T/2,fr=muerto?3:!P.suelo?2:Math.floor(tiempo*8)%2;
  if(!muerto&&P.duck&&IMG.playerduck&&sprite('playerduck',bx,GY-T,T,T,Math.floor(tiempo*8)%2))return;
  if(!muerto&&P.duck&&IMG.player){ctx.save();ctx.translate(0,GY);ctx.scale(1,.55);ctx.translate(0,-GY);sprite('player',bx,GY-T,T,T,fr);ctx.restore();return}
  if(!sprite('player',bx,P.y+P.h-T,T,T,fr))espacio(P.x-13,P.y,60,P.h,PROTA);
}
function dibBoss(b){

/* =====================================================================
   🎰 GACHA  (solo para jugar: lo que te sale NO cambia nada en la partida)
   Se saca con el botón GACHA del menú (o la tecla G).
   Premios = los dibujos del juego. Imágenes: dibujos/obs1.png, deco1.png, tiro1.png, boss1.png ... y dibujos/bossfinal.png (el jefe final: el que dibujás vos)
   ✏️ Para cambiar las probabilidades, cambiá los números "p" de acá abajo (tienen que sumar 100).
   ===================================================================== */
const RAREZAS={
  comun:{n:'Común',     c:'#7a7a7a',p:50,  info:'Obstáculos de cada mundo'},
  rara: {n:'Rara',      c:'#2f9be0',p:28,  info:'Decoraciones de cada mundo'},
  epica:{n:'Épica',     c:'#b04fd6',p:15,  info:'Disparos de los jefes'},
  boss: {n:'JEFE',      c:'#ff8a1f',p:6.5, info:'Los 5 jefes (muy difíciles)'},
  final:{n:'JEFE FINAL',c:'#e22222',p:0.5, info:'El más difícil de todos'}
};
const GACHA=[];
MUNDOS.forEach((m,i)=>{const n=i+1;
  GACHA.push({id:'obs'+n,  nombre:'Obstáculo: '+m.n, r:'comun',p:RAREZAS.comun.p/5});
  GACHA.push({id:'deco'+n, nombre:'Decoración: '+m.n,r:'rara', p:RAREZAS.rara.p/5});
  GACHA.push({id:'tiro'+n, nombre:'Disparo: '+nom(i), r:'epica',p:RAREZAS.epica.p/5});
  GACHA.push({id:'boss'+n, nombre:nom(i),            r:'boss', p:RAREZAS.boss.p/5});
});
GACHA.push({id:'bossfinal',nombre:'EL JEFE FINAL',r:'final',p:RAREZAS.final.p});
const GB={volver:{x:20,y:H-58,w:130,h:44},tirar:{x:W/2-105,y:H-62,w:210,h:50},probs:{x:W-210,y:H-58,w:190,h:44}};
let GX={fase:0,t:0,res:null,tmp:null,fl:0,hist:[],probs:false,n:0};   // fase: 0 esperando, 1 tirando, 2 resultado
const fmtP=v=>(Math.round(v*10)/10)+'';
function inR(x,y,r){return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h}
function abrirGacha(){estado='gacha';GX.probs=false;GX.fase=0;GX.res=null;snd(520,.1,'triangle',.04,780)}
function gachaRoll(){
  let tot=0;for(const it of GACHA)tot+=it.p;
  let r=Math.random()*tot;
  for(const it of GACHA){r-=it.p;if(r<0)return it}
  return GACHA[0];
}
function gachaTirar(){
  if(GX.fase===1)return;
  GX.fase=1;GX.t=0;GX.fl=0;GX.res=null;GX.probs=false;
}
function gachaUpd(dt){
  if(GX.fase===1){
    GX.t+=dt;GX.fl-=dt;
    if(GX.fl<=0){GX.fl=.07;GX.tmp=pick(GACHA);snd(300+Math.random()*300,.04,'square',.02)}
    if(GX.t>=1.4){
      const it=gachaRoll();
      GX.res=it;GX.hist.unshift(it);if(GX.hist.length>6)GX.hist.pop();
      GX.n++;GX.fase=2;GX.t=0;
      if(it.r==='final'){flash=1;shake=.6;snd(500,.9,'triangle',.07,1300)}
      else if(it.r==='boss'){flash=.6;shake=.3;snd(420,.5,'triangle',.06,900)}
      else if(it.r==='epica')snd(600,.3,'triangle',.05,900);
      else snd(400,.15,'square',.04,500);
    }
  }else if(GX.fase===2)GX.t+=dt;
}
function gachaClick(x,y){
  if(GX.probs){GX.probs=false;return}
  if(inR(x,y,GB.volver)){estado='menu';return}
  if(inR(x,y,GB.probs)){GX.probs=true;return}
  if(inR(x,y,GB.tirar))gachaTirar();
}
function dibItem(id,x,y,s,lab){if(!sprite(id,x,y,s,s))espacio(x,y,s,s,lab||id,id==='bossfinal'?'bossfinal.png':'')}
function dibBtn(r,label,fill,size){
  estilo();poli([[r.x,r.y],[r.x+r.w,r.y],[r.x+r.w,r.y+r.h],[r.x,r.y+r.h]],fill,3);
  txt(label,r.x+r.w/2,r.y+r.h/2,size||24,INK,'center',null);
}
function dibGacha(){
  ctx.fillStyle='#fdf6d8';ctx.fillRect(0,0,W,H);
  ctx.save();
  if(shake>0)ctx.translate(rnd(-5,5)*shake*2,rnd(-5,5)*shake*2);
  estilo();
  const cx=W/2,by=78,bs=150;
  txt('🎰 GACHA',cx,28,40);
  txt('Es solo para jugar: no cambia nada en la partida',cx,58,18,'#777','center',null);

  /* últimas tiradas */
  txt('Últimas tiradas',20,92,20,INK,'left',null);
  GX.hist.forEach((it,i)=>txt(it.nombre,20,120+i*24,16,RAREZAS[it.r].c,'left',null));
  txt('Tiradas: '+GX.n,W-20,92,20,INK,'right',null);

  /* centro */
  if(GX.fase===0){
    txt('Tocá TIRAR para ver qué te toca',cx,by+bs/2,26);
  }else if(GX.fase===1){
    const wob=Math.sin(GX.t*45)*4;
    ctx.globalAlpha=.9;dibItem(GX.tmp.id,cx-bs/2+wob,by,bs,'?');ctx.globalAlpha=1;
    txt('¡Tirando...!',cx,by+bs+26,26);
  }else if(GX.res){
    const it=GX.res,R=RAREZAS[it.r],k=1+Math.max(0,1-GX.t*5)*.5;
    ctx.save();ctx.globalAlpha=.22;ctx.fillStyle=R.c;ctx.beginPath();ctx.arc(cx,by+bs/2,bs*.62,0,6.3);ctx.fill();ctx.restore();
    ctx.save();ctx.translate(cx,by+bs/2);ctx.scale(k,k);dibItem(it.id,-bs/2,-bs/2,bs,it.nombre);ctx.restore();
    txt(it.nombre,cx,by+bs+20,26,R.c);
    txt(R.n+' · '+fmtP(it.p)+'%',cx,by+bs+46,20,'#555','center',null);
    if(it.r==='boss')txt('¡Te salió un jefe!',cx,by-12,26,'#ff8a1f');
    if(it.r==='final')txt('¡¡¡EL JEFE FINAL!!!',cx,by-12,30,'#e22222');
  }

  /* botones */
  dibBtn(GB.volver,'← VOLVER','#fff',22);
  dibBtn(GB.tirar,GX.fase===1?'...':'🎰 TIRAR','#fff6b8',28);
  dibBtn(GB.probs,'% PROBABILIDADES','#e7d6ff',17);

  /* lista de probabilidades */
  if(GX.probs){
    ctx.fillStyle='rgba(253,246,216,.97)';ctx.fillRect(110,14,W-220,H-28);
    estilo();poli([[110,14],[W-110,14],[W-110,H-14],[110,H-14]],null,9);
    txt('PROBABILIDADES',cx,42,30);
    Object.keys(RAREZAS).forEach((key,i)=>{
      const R=RAREZAS[key],cnt=GACHA.filter(g=>g.r===key).length,y=92+i*44;
      txt(R.n+'  '+fmtP(R.p)+'%',135,y,26,R.c,'left',null);
      txt(R.info+(cnt>1?'  (c/u '+fmtP(R.p/cnt)+'%)':''),W-135,y,18,'#555','right',null);
    });
    txt('(tocá para cerrar)',cx,H-34,18,'#777','center',null);
  }
  ctx.restore();
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+flash+')';ctx.fillRect(0,0,W,H)}
}

function render(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(estado==='menu'){dibMenu();return}
  if(estado==='gacha'){dibGacha();return}
  ctx.save();
  if(shake>0)ctx.translate(rnd(-5,5)*shake*2,rnd(-5,5)*shake*2);
  if(G.prev&&G.fase==='mundo'){dibMundo(G.prev.mundo,G.prev.decos);ctx.globalAlpha=Math.min(1,G.t/FADE_SEG);dibMundo(G.mundo,G.decos);ctx.globalAlpha=1}
  else dibMundo(G.mundo,G.decos);
  estilo();
  for(const o of G.obst){
    if(o.t==='pajaro'){const pid=pajaroId(G.mundo);if(!sprite(pid,o.x-14,o.y-22,72,60))espacio(o.x-14,o.y-22,72,60,'pájaro')}
    else if(!sprite('obs'+(G.mundo+1),o.x-4,o.y-4,o.w+8,o.h+4))espacio(o.x-4,o.y-4,o.w+8,o.h+4,'obst.');
  }
  if(G.boss)dibBoss(G.boss);
  for(const m of G.min)dibMinion(m);
  for(const q of G.proj){
    estilo();
    if(q.k==='criatura'){
      const bob=q.aire?0:-Math.abs(Math.sin(q.t*11))*5,rot=q.aire?q.rot:Math.sin(q.t*18)*.13;
      ctx.save();ctx.translate(q.x,q.y+bob);ctx.rotate(rot);
      if(!sprite(q.id,-32,-32,64,64))espacio(-32,-32,64,64,'criatura');
      ctx.restore();
      if(!q.aire){estilo();trazo([[q.x+30,GY-8],[q.x+44,GY-8]],1);trazo([[q.x+32,GY-18],[q.x+42,GY-18]],1)}
    }else{
      if(!sprite(q.id,q.x-28,q.y-28,56,56))espacio(q.x-28,q.y-28,56,56,'disparo');
      estilo();trazo([[q.x+32,q.y-6],[q.x+50,q.y-6]],1);trazo([[q.x+34,q.y+6],[q.x+46,q.y+6]],1);
    }
  }
  for(const bl of G.balas){estilo();if(!sprite('bala',bl.x-14,bl.y-12,28,24)){blob(bl.x,bl.y,6,6,'#ffe45c',1);trazo([[bl.x-8,bl.y],[bl.x-20,bl.y]],1)}}
  dibJugador();
  for(const p of G.part){
    const a=Math.max(0,p.l/p.max);ctx.globalAlpha=Math.min(1,a*1.5);
    if(p.k==='e'){ctx.strokeStyle=p.c;ctx.lineWidth=3;trazo([[p.x-6,p.y],[p.x+6,p.y]],.3);trazo([[p.x,p.y-6],[p.x,p.y+6]],.3)}
    else{ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,4,0,6.3);ctx.fill()}
    ctx.globalAlpha=1;
  }
  for(const t of G.textos){ctx.globalAlpha=Math.min(1,t.l*2);txt(t.s,t.x,t.y,24,'#e22');ctx.globalAlpha=1}
  ctx.restore();

  /* HUD y pantallas */
  if(estado!=='menu')dibHud();
  if(estado==='jugando'){
    if(G.fase==='mundo'){ctx.globalAlpha=G.prev?Math.min(1,G.t/1.2):1;const m=MUNDOS[G.mundo];txt('MUNDO '+(G.mundo+1),W/2,H/2-40,56);txt(m.n,W/2,H/2+10,36);txt(MOSTRAR_NOMBRES?'Jefe: '+JEFES[G.mundo].nombre:'¡Un jefe te espera!',W/2,H/2+52,26);ctx.globalAlpha=1}
    if(G.fase==='aviso'){const s=1+Math.sin(tiempo*20)*.06;txt('¡¡CUIDADO!!',W/2,H/2-30,52*s,'#e22');txt(MOSTRAR_NOMBRES?'viene '+JEFES[G.mundo].nombre:'se viene el jefe',W/2,H/2+20,30)}
    if(G.fase==='jefe'&&G.boss&&G.boss.estado==='lucha'&&G.boss.t<3.2)txt('¡Dispará con ENTER!',W/2,H-24,22);
    if(G.boss&&G.boss.escudo&&G.boss.estado==='lucha'&&G.boss.t<6)txt(G.boss.esc?'escudo ON':'¡ahora!',G.boss.x+G.boss.w/2,G.boss.y+G.boss.h+22,22,G.boss.esc?'#3b8bd6':'#2a9d2a');
  }
  if(estado==='gameover'){
    ctx.fillStyle='rgba(246,241,228,.82)';ctx.fillRect(0,0,W,H);
    dibJugador();   // Bruno muerto se ve completo, encima del velo
    txt('¡PERDISTE!',W/2,H/2-40,64,'#e22');
    txt(MOSTRAR_NOMBRES?'te ganó '+JEFES[G.mundo].nombre:'te ganó el jefe '+(G.mundo+1),W/2,H/2+10,30);
    if(G.tOver>.6)txt('ESPACIO (o tocá) para reintentar',W/2,H/2+60,26);
  }
  if(estado==='victoria'){
    ctx.fillStyle='rgba(246,241,228,.6)';ctx.fillRect(0,0,W,H);
    for(const p of G.part){ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,8,5)}
    txt('¡GANASTE!',W/2,H/2-45,72,'#2a9d2a');
    txt(FIN_TEXTO,W/2,H/2+12,28);
    if(G.tOver>1.2)txt('ESPACIO (o tocá) para volver al menú',W/2,H/2+62,24);
  }
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+flash+')';ctx.fillRect(0,0,W,H)}
}

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  update(dt);render();requestAnimationFrame(frame);
}

/* ---------- controles ---------- */
function saltar(){if(estado==='jugando')P.buf=.12;else if(estado!=='menu')empezar()}
addEventListener('keydown',e=>{
  const k=e.key;
  if([' ','ArrowUp','ArrowDown','Enter'].includes(k))e.preventDefault();
  if(estado==='gacha'){
    if(k===' '||k==='Enter'){if(!e.repeat){if(GX.probs)GX.probs=false;else gachaTirar()}}
    else if(k==='Escape'||k==='Backspace'){if(GX.probs)GX.probs=false;else estado='menu'}
    else if(k==='p'||k==='P')GX.probs=!GX.probs;
    else if(k==='m'||k==='M')togMute();
    return;
  }
  if(k===' '||k==='ArrowUp'||k==='w'||k==='W'){if(estado==='jugando')P.buf=.12;else if(!e.repeat)empezar()}
  else if(k==='ArrowDown'||k==='s'||k==='S')keys.abajo=true;
  else if(k==='Enter'){if(estado==='jugando')keys.disp=true;else if(!e.repeat)empezar()}
  else if(k==='m'||k==='M')togMute();
  if(estado==='menu'&&(k==='g'||k==='G'))abrirGacha();
  if(estado==='menu'&&k>='1'&&k<='5')nuevo(+k-1,true);
});
addEventListener('keyup',e=>{
  const k=e.key;
  if(k==='ArrowDown'||k==='s'||k==='S')keys.abajo=false;
  if(k==='Enter')keys.disp=false;
});
cv.addEventListener('pointerdown',e=>{
  if(estado==='jugando')return;
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  if(estado==='menu'){
    if(inR(x,y,BTN))empezar();
    else if(inR(x,y,GBTN))abrirGacha();
    return;
  }
  if(estado==='gacha'){gachaClick(x,y);return}
  empezar();
});
function hold(id,on,off){
  const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();on()});
  ['pointerup','pointerleave','pointercancel'].forEach(t=>el.addEventListener(t,e=>{e.preventDefault();off&&off()}));
}
hold('bSalta',()=>saltar());
hold('bAgacha',()=>{keys.abajo=true},()=>{keys.abajo=false});
hold('bDispara',()=>{if(estado!=='jugando'&&estado!=='menu'&&estado!=='gacha')empezar();keys.disp=true},()=>{keys.disp=false});
function togMute(){mute=!mute;document.getElementById('bMute').textContent=mute?'🔇 Sonido':'🔊 Sonido';document.getElementById('bMuteT').textContent=mute?'🔇':'🔊'}
document.getElementById('bMute').onclick=e=>{togMute();e.target.blur()};
document.getElementById('bMuteT').onclick=e=>{togMute();e.target.blur()};
function togFS(){const d=document,el=d.documentElement;try{if(d.fullscreenElement||d.webkitFullscreenElement)(d.exitFullscreen||d.webkitExitFullscreen).call(d);else (el.requestFullscreen||el.webkitRequestFullscreen).call(el)}catch(e){}}
['bFs','bFsT'].forEach(id=>{const b=document.getElementById(id);
  if(!document.documentElement.requestFullscreen&&!document.documentElement.webkitRequestFullscreen)b.style.display='none';
  b.onclick=e=>{togFS();e.target.blur()}});

requestAnimationFrame(frame);
</script>
</body>
